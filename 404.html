<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost at sea — Art Xenos D. Guadalquiver</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F7B9A6">
  <!-- Root-relative paths, because GitHub Pages serves this page at whatever address was not found -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Same theme rules as the home page: the visitor's choice, then a dark device, then the local time -->
  <script>
    (function () {
      var hour = new Date().getHours();
      var daySky = hour >= 5 && hour < 8 ? 'dawn' : hour >= 8 && hour < 16 ? 'midday' : 'sunset';
      var choice;
      try { choice = localStorage.getItem('theme'); } catch (e) { /* storage blocked */ }
      var theme;
      if (choice === 'night') theme = 'night';
      else if (choice === 'day' || choice === 'sunset') theme = daySky;
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'night';
      else theme = hour >= 5 && hour < 19 ? daySky : 'night';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Nunito:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .lost-code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 22vw, 10rem);
      font-weight: 700;
      line-height: 1;
      margin: 0 0 0.2em;
      color: var(--plum);
      text-shadow: 0 2px 18px rgba(255, 253, 249, 0.45);
    }

    [data-theme="night"] .lost-code { text-shadow: 0 2px 18px rgba(21, 18, 51, 0.6); }

    .lost-title { font-size: clamp(1.6rem, 5vw, 2.6rem); }

    .lost-text {
      max-width: 36ch;
      margin: 0 auto 1.8rem;
    }

    /* A message in a bottle, riding the waves where the beach ball sits on the home page */
    .bottle {
      position: absolute;
      left: 16%;
      bottom: 10%;
      width: 34px;
      height: 78px;
      z-index: 5;
      animation: bottle-drift 6s ease-in-out infinite;
    }

    @keyframes bottle-drift {
      0%, 100% { transform: translate(0, 0) rotate(24deg); }
      50% { transform: translate(14px, -16px) rotate(36deg); }
    }
  </style>
</head>

<body>

  <main class="hero">
    <div class="sky-layer"></div>
    <div class="horizon horizon--far">
      <div class="horizon-track">
        <svg viewBox="0 0 1440 200" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0,120 C240,60 480,160 720,110 C960,60 1200,150 1440,120 L1440,200 L0,200 Z"></path>
        </svg>
        <svg viewBox="0 0 1440 200" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0,120 C240,60 480,160 720,110 C960,60 1200,150 1440,120 L1440,200 L0,200 Z"></path>
        </svg>
      </div>
    </div>
    <div class="horizon horizon--near">
      <div class="horizon-track">
        <svg viewBox="0 0 1440 200" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0,140 C300,180 600,100 900,150 C1100,180 1300,120 1440,140 L1440,200 L0,200 Z"></path>
        </svg>
        <svg viewBox="0 0 1440 200" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0,140 C300,180 600,100 900,150 C1100,180 1300,120 1440,140 L1440,200 L0,200 Z"></path>
        </svg>
      </div>
    </div>
    <div class="sun"></div>
    <svg class="bottle" viewBox="0 0 34 78" aria-hidden="true">
      <rect x="12" y="0" width="10" height="9" rx="2" fill="#9E6B4A"></rect>
      <path d="M13 8h8v12c5 3 9 8 9 15v34a7 7 0 0 1-7 7H11a7 7 0 0 1-7-7V35c0-7 4-12 9-15z"
        fill="rgba(255, 253, 249, 0.55)" stroke="#3D6380" stroke-width="2"></path>
      <rect x="10" y="36" width="14" height="26" rx="2" fill="#FFFDF9" stroke="#E8927C" stroke-width="1.5"></rect>
      <path d="M13 43h8M13 49h8M13 55h5" stroke="#3D3352" stroke-width="1.4" stroke-linecap="round"></path>
    </svg>
    <div class="hero-content">
      <p class="eyebrow">Page not found</p>
      <p class="lost-code" aria-hidden="true">404</p>
      <h1 class="lost-title">Lost at sea</h1>
      <p class="lost-text">This page drifted away, or it was never on the map. The shore is still where you left
        it.</p>
      <div class="hero-actions">
        <a href="/" class="hero-btn hero-btn--primary">Back to shore</a>
        <a href="/#projects" class="hero-btn">See my projects</a>
      </div>
    </div>
  </main>

</body>

</html>
